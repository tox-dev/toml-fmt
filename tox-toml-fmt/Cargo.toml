[package]
name = "tox-toml-fmt"
version = "1.10.1"
description = "Format tox.toml files"
repository = "https://github.com/tox-dev/tox-toml-fmt"
license = "MIT"
edition = "2021"

[lib]
name = "_tox_toml_fmt"
path = "rust/src/main.rs"
# `rlib` beside the `cdylib` the wheel needs, so the tests can link against the crate and run
# through the same entry point a user calls
crate-type = ["cdylib", "rlib"]

[[test]]
# the tests link against the crate and go through the entry point a user calls, so they live beside
# `src` rather than inside it
name = "rules"
path = "rust/tests/mod.rs"

[dependencies]
common = { path = "../common", features = ["python"] }
toml-doc = { path = "../toml-doc" }
tox-rules = { path = "../tox-rules" }
pyo3 = { version = "0.29.2", features = ["generate-import-lib"] }
regex = { version = "1.13.1" }

[features]
extension-module = ["pyo3/extension-module"]
# `abi3` can be disabled to produce per-version wheels (needed for free-threaded 3.15t until
# CPython lands PEP 803 abi3t loader: https://github.com/python/cpython/issues/146636).
abi3 = ["pyo3/abi3-py310"]
default = ["extension-module", "abi3"]

[dev-dependencies]
common = { path = "../common", features = ["python"] }
indoc = { version = "2.0.7" }   # dedented test cases for literal strings
insta = { version = "1.48.0", features = ["redactions"] } # snapshot testing
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
toml = "1.1.4"                  # an independent parser, to read back what the formatter wrote
