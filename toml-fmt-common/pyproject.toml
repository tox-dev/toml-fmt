[build-system]
build-backend = "uv_build"
requires = [ "uv-build<0.14,>=0.13.4" ]

[project]
name = "toml-fmt-common"
version = "1.3.5"
description = "Shared CLI support for TOML formatters"
readme = "README.md"
keywords = [
  "formatter",
  "toml",
]
license = "MIT"
license-files = [ "LICENSE.txt" ]
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
urls.Changelog = "https://github.com/tox-dev/toml-fmt/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/tox-dev/toml-fmt/tree/main/toml-fmt-common#toml-fmt-common"
urls.Homepage = "https://github.com/tox-dev/toml-fmt"
urls.Source = "https://github.com/tox-dev/toml-fmt/tree/main/toml-fmt-common"
urls.Tracker = "https://github.com/tox-dev/toml-fmt/issues"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.16",
]
type = [
  "mypy==2.4",
  { include-group = "test" },
]
pkg-meta = [
  "check-wheel-contents>=0.6.3",
  "twine>=7",
  "uv>=0.13.1",
]

[tool.uv]
build-backend.source-include = [ "tests/**", "tox.toml" ]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.mypy]
# the workflow filters the tests read live beside the workflows themselves, a directory up
mypy_path = "../tasks"
strict = true
show_error_codes = true

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.other = [
  ".",
  "*/toml_fmt_common",
  "*\\toml_fmt_common",
]
paths.source = [
  "src",
  ".tox/*/lib/*/site-packages",
  ".tox\\*\\Lib\\site-packages",
  "**/src",
  "**\\src",
]
report.fail_under = 100
html.show_contexts = true
html.skip_covered = false
