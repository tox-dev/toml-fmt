default_language_version:
  python: python3.15
ci:
  autoupdate_schedule: quarterly
  # these build the local Rust extension via uv; pre-commit.ci has no toolchain, so CI regenerates instead
  skip: [readme-pyproject-fmt, readme-tox-toml-fmt]
repos:
  - repo: local
    hooks:
      - id: readme-pyproject-fmt
        name: regenerate pyproject-fmt README (runs doc examples through the formatter)
        language: system
        entry: uv run --project pyproject-fmt python tasks/generate_readme.py pyproject-fmt
        pass_filenames: false
        always_run: true
      - id: readme-tox-toml-fmt
        name: regenerate tox-toml-fmt README (runs doc examples through the formatter)
        language: system
        entry: uv run --project tox-toml-fmt python tasks/generate_readme.py tox-toml-fmt
        pass_filenames: false
        always_run: true
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "50e0f3aee9dc5747a5f173f79a7417403c18dda6" # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "44b5042edab9382aba712eed4f9c7bab7a3d6a3e" # frozen: v0.17.0
    hooks:
      - id: ruff-format
        args: ["--config", "pyproject.toml"]
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix", "--config", "pyproject.toml"]
  - repo: https://github.com/google/yamlfmt
    rev: "21ca5323a9c87ee37a434e0ca908efc0a89daa07" # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # frozen: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "120"]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-ruff==0.1.3
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0494aa7fa1314e98913a41227d8f0a515b2c1049" # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '17e12779811926f000bdfa1795f9e3735dd71ac3' # frozen: 0.26
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
