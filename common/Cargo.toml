[package]
name = "common"
version = "1.0.0"
description = "Common code for formatting TOML files"
repository = "https://github.com/tox-dev/toml-fmt"
readme = "README.md"
license = "MIT"
edition = "2024"

[dependencies]
lexical-sort = { version = "0.3.1" } # the natural order names sort in
regex = { version = "1.13.1" }
toml-doc = { path = "../toml-doc" }
unicode-segmentation = { version = "1.13.3" } # where a line may break, which is between graphemes
unicode-width = { version = "0.2.2" }         # how many columns the text takes to write
# handing the settings a file writes to the Python wrappers, which read them with this parser
# rather than a second one of an older TOML
pyo3 = { version = "0.29.2", optional = true }

[features]
python = ["dep:pyo3"]

[dev-dependencies]
indoc = { version = "2.0.7" }   # dedented test cases for literal strings
insta = { version = "1.48.0", features = ["redactions"] } # snapshot testing
toml = "1.1.4"                  # an independent parser, to read back what a pass wrote
