requires = [ "tox>=4.64.7", "tox-uv>=1.36.1" ]
env_list = [ "fix" ]

[env_run_base]
default_base_python = [ "3.15" ]

[env_pkg_base]
default_base_python = [ "3.15" ]

[env.fix]
description = "format supported files and report remaining violations"
skip_install = true
deps = [ "pre-commit-uv>=4.3" ]
pass_env = [ "PROGRAMDATA" ]
commands = [ [ "pre-commit", "run", "--all-files", "--show-diff-on-failure", { replace = "posargs", extend = true } ] ]

[env.coverage]
description = "generate HTML coverage report"
skip_install = true
commands = [
  [ "cargo", "llvm-cov", "--workspace", "--no-default-features", "--lcov", "--output-path", "coverage.lcov" ],
  [
    "genhtml",
    "coverage.lcov",
    "-o",
    "cov-html",
    "--legend",
    "--branch-coverage",
    "--function-coverage",
    "--hierarchical",
    "--show-navigation",
    "--num-spaces",
    "4",
    "--precision",
    "2",
    "--title",
    "toml-fmt Coverage",
  ],
  [ "open", "cov-html/index.html" ],
]
allowlist_externals = [ "cargo", "genhtml", "open" ]
