name: Reconcile package with PyPI
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      version:
        required: true
        type: string
      mode:
        required: true
        type: string
      dist-artifact-id:
        description: Validated distribution artifact ID
        required: true
        type: string
      manifest-artifact-id:
        description: Validated SHA256 manifest artifact ID
        required: true
        type: string
    outputs:
      missing-count:
        value: ${{ jobs.reconcile.outputs.missing-count }}
      missing-artifact-id:
        description: Artifact ID of the files PyPI lacked before upload
        value: ${{ jobs.reconcile.outputs.missing-artifact-id }}
permissions: {}
jobs:
  reconcile:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      missing-count: ${{ steps.reconcile.outputs.missing-count }}
      missing-artifact-id: ${{ steps.missing.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check validated artifact references
        env:
          DIST_ID: ${{ inputs.dist-artifact-id }}
          MANIFEST_ID: ${{ inputs.manifest-artifact-id }}
        run: test -n "$DIST_ID" && test -n "$MANIFEST_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.dist-artifact-id }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.manifest-artifact-id }}
          path: ${{ runner.temp }}/release-manifest
      - name: Check validated distribution hashes
        working-directory: dist
        run: sha256sum --check --strict "$RUNNER_TEMP/release-manifest/dist.sha256"
      - name: Check validated distribution count
        env:
          MANIFEST: ${{ runner.temp }}/release-manifest/dist.sha256
        run: >-
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq "$(wc -l <"$MANIFEST")"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - id: reconcile
        uses: tox-dev/github-workflows/reconcile-pypi-artifacts@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          project: ${{ inputs.package }}
          version: ${{ inputs.version }}
          dist: dist
          mode: ${{ inputs.mode }}
      - id: missing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode == 'stage'
        with:
          name: ${{ inputs.package }}-missing-manifest-${{ github.run_attempt }}
          path: ${{ steps.reconcile.outputs.manifest }}
          if-no-files-found: error
