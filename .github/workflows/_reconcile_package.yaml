name: 🔍 Reconcile package with PyPI
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      version:
        required: true
        type: string
      artifact-pattern:
        description: Name pattern of the distribution artifacts
        required: true
        type: string
permissions: {}
jobs:
  reconcile:
    name: 🔍 Verify PyPI distributions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: dist
          merge-multiple: true
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: 🔍 Verify PyPI artifacts
        uses: tox-dev/github-workflows/reconcile-pypi-artifacts@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
        with:
          project: ${{ inputs.package }}
          version: ${{ inputs.version }}
          dist: dist
