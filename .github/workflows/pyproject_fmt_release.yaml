name: 🚀 pyproject-fmt
on:
  push:
    tags: ["pyproject-fmt/*"]
permissions: {}
concurrency:
  group: release-pyproject-fmt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: $/.github/workflows/pyproject_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  validate:
    needs: build
    uses: $/.github/workflows/_validate_package.yaml
    permissions:
      contents: read
    with:
      package: pyproject-fmt
      version: ${{ needs.build.outputs.version }}
      artifact-pattern: pyproject-fmt-wheels-*
  github-draft:
    if: github.repository == 'tox-dev/toml-fmt'
    needs: [build, validate]
    uses: $/.github/workflows/_github_package_release.yaml
    permissions:
      contents: write
    with:
      package: pyproject-fmt
      version: ${{ needs.build.outputs.version }}
      phase: stage
  stage:
    if: github.repository == 'tox-dev/toml-fmt'
    needs: [build, validate, github-draft]
    uses: $/.github/workflows/_reconcile_package.yaml
    permissions:
      contents: read
    with:
      package: pyproject-fmt
      version: ${{ needs.build.outputs.version }}
      mode: stage
      dist-artifact-id: ${{ needs.validate.outputs.dist-artifact-id }}
      manifest-artifact-id: ${{ needs.validate.outputs.manifest-artifact-id }}
  pypi:
    if: needs.stage.outputs.missing-count != '0'
    needs: [build, validate, stage]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/pyproject-fmt/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check publication artifact references
        env:
          DIST_ID: ${{ needs.validate.outputs.dist-artifact-id }}
          MANIFEST_ID: ${{ needs.validate.outputs.manifest-artifact-id }}
          MISSING_ID: ${{ needs.stage.outputs.missing-artifact-id }}
        run: test -n "$DIST_ID" && test -n "$MANIFEST_ID" && test -n "$MISSING_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.dist-artifact-id }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.manifest-artifact-id }}
          path: ${{ runner.temp }}/release-manifest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.stage.outputs.missing-artifact-id }}
          path: ${{ runner.temp }}/missing-manifest
      - name: Check uploaded distribution hashes
        working-directory: dist
        run: sha256sum --check --strict "$RUNNER_TEMP/release-manifest/dist.sha256"
      - name: Check uploaded distribution count
        env:
          MANIFEST: ${{ runner.temp }}/release-manifest/dist.sha256
        run: >-
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq "$(wc -l <"$MANIFEST")"
      - uses: tox-dev/github-workflows/select-pypi-artifacts@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          dist: dist
          manifest: ${{ runner.temp }}/missing-manifest/pypi-missing-names.txt
          output-dir: publish-dist
          expected-count: ${{ needs.stage.outputs.missing-count }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist
  verify:
    needs: [build, validate, stage, pypi]
    if: always() && needs.stage.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.pypi.result)
    uses: $/.github/workflows/_reconcile_package.yaml
    permissions:
      contents: read
    with:
      package: pyproject-fmt
      version: ${{ needs.build.outputs.version }}
      mode: verify
      dist-artifact-id: ${{ needs.validate.outputs.dist-artifact-id }}
      manifest-artifact-id: ${{ needs.validate.outputs.manifest-artifact-id }}
  github-release:
    needs: [build, verify, github-draft]
    uses: $/.github/workflows/_github_package_release.yaml
    permissions:
      contents: write
    with:
      package: pyproject-fmt
      version: ${{ needs.build.outputs.version }}
      phase: publish
      notes-sha: ${{ needs.github-draft.outputs.notes-sha }}
      notes-artifact-id: ${{ needs.github-draft.outputs.notes-artifact-id }}
