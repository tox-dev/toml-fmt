name: 🚀 pyproject-fmt
on:
  push:
    tags: ["pyproject-fmt/*"]
permissions: {}
concurrency:
  group: release-pyproject-fmt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: $/.github/workflows/pyproject_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  publish:
    if: github.repository == 'tox-dev/toml-fmt' && startsWith(github.ref, 'refs/tags/pyproject-fmt/')
    needs: build
    uses: $/.github/workflows/_publish_package.yaml
    permissions:
      contents: write
      id-token: write
    with:
      package: pyproject-fmt
      version: ${{ needs.build.outputs.version }}
      artifact-pattern: pyproject-fmt-wheels-*
