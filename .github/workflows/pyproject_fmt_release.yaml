name: 🚀 pyproject-fmt
on:
  push:
    tags: ["pyproject-fmt/*"]
permissions: {}
concurrency:
  group: release-pyproject-fmt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: $/.github/workflows/pyproject_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  validate:
    needs: build
    uses: $/.github/workflows/_validate_package.yaml
    permissions:
      contents: read
    with:
      package: pyproject-fmt
      version: ${{ needs.build.outputs.version }}
      artifact-pattern: pyproject-fmt-wheels-*
  pypi:
    if: github.repository == 'tox-dev/toml-fmt' && startsWith(github.ref, 'refs/tags/pyproject-fmt/')
    needs: [build, validate]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/pyproject-fmt/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pyproject-fmt-validated-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pyproject-fmt-validated-manifest
          path: ${{ runner.temp }}/release-manifest
      - name: Check uploaded distribution hashes
        working-directory: dist
        run: sha256sum --check --strict "$RUNNER_TEMP/release-manifest/dist.sha256"
      - name: Check uploaded distribution count
        run: test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq "$(wc -l < "$RUNNER_TEMP/release-manifest/dist.sha256")"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  github-release:
    needs: [build, pypi]
    uses: $/.github/workflows/_github_package_release.yaml
    permissions:
      contents: write
    with:
      package: pyproject-fmt
      version: ${{ needs.build.outputs.version }}
