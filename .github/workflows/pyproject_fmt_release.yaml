name: 🚀 pyproject-fmt
on:
  push:
    tags: ["pyproject-fmt/*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: 🏷️ Read release version
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🏷️ Strip the package prefix from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: printf 'version=%s\n' "${TAG#pyproject-fmt/}" >>"$GITHUB_OUTPUT"
  notes:
    name: 📝 Render GitHub Release notes
    needs: version
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@e406a30296cdc06197691769fd40843ddd8c7eb0 # 6.5.1
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      changelog: CHANGELOG.md
      package: pyproject-fmt
      artifact-url: https://pypi.org/project/pyproject-fmt/${{ needs.version.outputs.version }}/
  build:
    name: 🏗️ Build distributions
    uses: $/.github/workflows/pyproject_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  pypi:
    name: 🚀 Publish to PyPI
    if: github.repository == 'tox-dev/toml-fmt'
    needs: [version, build]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/pyproject-fmt/${{ needs.version.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pyproject-fmt-wheels-*
          path: dist
          merge-multiple: true
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [version, build, pypi, notes]
    uses: tox-dev/github-workflows/.github/workflows/github-release.yaml@e406a30296cdc06197691769fd40843ddd8c7eb0 # 6.5.1
    permissions:
      contents: write
    with:
      project: pyproject-fmt
      version: ${{ needs.version.outputs.version }}
      tag: ${{ github.ref_name }}
      artifact-pattern: pyproject-fmt-wheels-*
      notes-artifact-id: ${{ needs.notes.outputs.artifact-id }}
