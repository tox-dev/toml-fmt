name: 🛡️ CodeQL
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 9 * * 2"
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  analyze:
    name: 🛡️ Analyze
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@e406a30296cdc06197691769fd40843ddd8c7eb0 # 6.5.1
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions","python","rust"]'
      paths-ignore: '["**/tests","tasks"]'
