name: 🧪 toml-fmt-common
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  workflow_call:
  schedule:
    - cron: "15 8 * * *"
concurrency:
  group: toml_fmt_common_test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    name: 🧭 Detect changes
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🧭 Detect changed paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            run:
              - 'toml-fmt-common/**'
              - '.github/workflows/toml_fmt_common_test.yaml'
  test:
    name: 🧪 ${{ matrix.env }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    environment: test
    strategy:
      fail-fast: false
      matrix:
        env: ["3.15", "3.15t", "3.14", "3.13", "3.12", "3.11", type, pkg_meta]
    defaults:
      run:
        working-directory: toml-fmt-common
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 🐍 Install Python
        if: startsWith(matrix.env, '3.') && matrix.env != '3.15'
        run: uv python install --python-preference only-managed ${{ matrix.env }}
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: 📦 Set up test suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.env }}
      - name: 🧪 Run test suite
        run: tox run --skip-pkg-install -e ${{ matrix.env }}
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
      - name: 📊 Upload coverage
        if: startsWith(matrix.env, '3.')
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: toml-fmt-common/.tox/${{ matrix.env }}
          flags: python-${{ matrix.env }}
  all-pass:
    name: 🚦 toml-fmt-common
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Decide whether all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were canceled"
            exit 1
          fi
          echo "All jobs passed or were skipped"
