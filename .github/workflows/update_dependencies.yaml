name: 🔀 update dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
jobs:
  python:
    name: 📦 Bump Python dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_CREATOR_CUTOFF: '2026-10-26T18:24:46Z'
      UV_BUILD_CUTOFF: '2026-10-20T15:11:07Z'
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
      - name: 📦 Install tox
        run: uv tool install tox --with tox-uv
      - name: 📖 Generate README.rst
        run: |
          tox r -e readme -c pyproject-fmt
          tox r -e readme -c tox-toml-fmt
      - name: 📦 Bump dependencies
        run: |
          uvx bump-deps-index -i https://pypi.org/simple -f pyproject.toml tox.toml
          uvx bump-deps-index -i https://pypi.org/simple -f pyproject-fmt/pyproject.toml pyproject-fmt/tox.toml
          uvx bump-deps-index -i https://pypi.org/simple -f tox-toml-fmt/pyproject.toml tox-toml-fmt/tox.toml
          uvx bump-deps-index -i https://pypi.org/simple -f toml-fmt-common/pyproject.toml toml-fmt-common/tox.toml
      - name: ⚙️ Set dependency age cutoff
        id: cutoff
        run: printf 'value=%s\n' "$(date --utc --date='7 days ago' '+%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
      - name: 🔒 Refresh workspace lock
        env:
          UV_EXCLUDE_NEWER: ${{ steps.cutoff.outputs.value }}
        run: |
          uv lock --upgrade \
            --exclude-newer-package "release-creator=$RELEASE_CREATOR_CUTOFF" \
            --exclude-newer-package "uv-build=$UV_BUILD_CUTOFF"
      - name: 🔒 Make workspace lock usable without a cutoff
        run: uv lock
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@29d4d5e6900db30502d7249043b59c18284a9777 # 6.2.0
        with:
          groups: release-prepare
          venv: ${{ runner.temp }}/release-tools
      - name: 🧹 Run repository hooks
        run: '"$RUNNER_TEMP/release-tools/bin/prek" run --all-files'
      - name: 📝 Save the changes
        run: git diff HEAD --binary >"$RUNNER_TEMP/changes.patch"
      - name: 📤 Upload Python patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-patch
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
  python-pr:
    name: 🔀 Open Python dependencies PR
    needs: python
    uses: $/.github/workflows/app-pr.yaml
    with:
      kind: python
      branch: update-python-dependencies
      title: Update Python dependencies
      body: Update dependency constraints from the scheduled scan.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
  rust:
    name: 📦 Bump Rust dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: 📦 Update Cargo.toml dependencies
        run: |
          cargo install cargo-edit --version 0.13.13 --locked
          cargo upgrade --incompatible
      - name: 🔒 Update Cargo.lock
        run: cargo update
      - name: 🔍 Check for a compatible cargo-edit update
        id: cargo-edit
        run: |
          set -euo pipefail
          metadata=$(curl -fsSL -H 'User-Agent: toml-fmt-updater' https://crates.io/api/v1/crates/cargo-edit)
          candidate=$(jq -ce '.versions | map({num, rust_version, yanked})' <<<"$metadata" | python3 tasks/update_cargo_edit.py candidate --rust-version "$(rustc --version | cut -d ' ' -f 2)")
          if test -n "$candidate"; then
            printf 'version=%s\n' "$candidate" >>"$GITHUB_OUTPUT"
          fi
      - name: 📦 Update the compatible cargo-edit pin
        if: steps.cargo-edit.outputs.version != ''
        env:
          VERSION: ${{ steps.cargo-edit.outputs.version }}
        run: |
          set -euo pipefail
          cargo install cargo-edit --version "$VERSION" --locked --root "$RUNNER_TEMP/cargo-edit-candidate"
          python3 tasks/update_cargo_edit.py update "$VERSION"
      - name: 📝 Save the changes
        run: git diff HEAD --binary >"$RUNNER_TEMP/changes.patch"
      - name: 📤 Upload Rust patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-patch
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
  rust-pr:
    name: 🔀 Open Rust dependencies PR
    needs: rust
    uses: $/.github/workflows/app-pr.yaml
    with:
      kind: rust
      branch: update-rust-dependencies
      title: Update Rust dependencies
      body: Update Cargo manifests and the lockfile from the scheduled scan.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
  release-tools:
    name: 🔀 Upgrade release tools
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@29d4d5e6900db30502d7249043b59c18284a9777 # 6.2.0
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
