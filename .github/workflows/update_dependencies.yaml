name: 🔀 update dependencies
on:
  workflow_dispatch:
    inputs:
      exclude-newer-package:
        description: Newline-separated name=date cutoffs that let a package's newer release into this run past the seven day cooldown
        type: string
        default: ""
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
jobs:
  python:
    name: 📦 Bump Python dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
      - name: 📦 Install tox
        run: uv tool install tox --with tox-uv
      - name: 📖 Generate README.rst
        run: |
          tox r -e readme -c pyproject-fmt
          tox r -e readme -c tox-toml-fmt
      - name: ⚙️ Set dependency age cutoff
        id: cutoff
        run: printf 'value=%s\n' "$(date --utc --date='7 days ago' '+%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
      - name: 📦 Bump dependencies
        env:
          CUTOFF: ${{ steps.cutoff.outputs.value }}
        run: |
          uvx 'bump-deps-index>=1.18' --exclude-newer "$CUTOFF" -i https://pypi.org/simple -f pyproject.toml tox.toml
          uvx 'bump-deps-index>=1.18' --exclude-newer "$CUTOFF" -i https://pypi.org/simple -f pyproject-fmt/pyproject.toml pyproject-fmt/tox.toml
          uvx 'bump-deps-index>=1.18' --exclude-newer "$CUTOFF" -i https://pypi.org/simple -f tox-toml-fmt/pyproject.toml tox-toml-fmt/tox.toml
          uvx 'bump-deps-index>=1.18' --exclude-newer "$CUTOFF" -i https://pypi.org/simple -f toml-fmt-common/pyproject.toml toml-fmt-common/tox.toml
      - name: 🔒 Refresh workspace lock
        env:
          UV_EXCLUDE_NEWER: ${{ steps.cutoff.outputs.value }}
          EXPEDITE: ${{ inputs.exclude-newer-package }}
        run: |
          set -euo pipefail
          expedite=()
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              expedite+=(--exclude-newer-package "$line")
            fi
          done <<<"$EXPEDITE"
          uv lock --upgrade "${expedite[@]}"
      - name: 🔒 Make workspace lock usable without a cutoff
        run: uv lock
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@6.8.0
        with:
          groups: release-prepare
          venv: ${{ runner.temp }}/release-tools
      - name: 🧹 Run repository hooks
        run: '"$RUNNER_TEMP/release-tools/bin/prek" run --all-files'
      - name: 📝 Save the changes
        id: patch
        run: |
          set -euo pipefail
          if git diff --quiet HEAD; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
            echo 'Maintenance patch skipped: no tracked file changed'
            exit 0
          fi
          git diff HEAD --binary >"$RUNNER_TEMP/maintenance.patch"
          echo 'changed=true' >>"$GITHUB_OUTPUT"
      - name: 📤 Upload maintenance patch
        id: upload
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          if-no-files-found: error
  python-pr:
    name: 🔀 Open Python dependencies PR
    needs: python
    if: needs.python.outputs.changed == 'true'
    uses: tox-dev/github-workflows/.github/workflows/open-maintenance-pr.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    with:
      artifact-id: ${{ needs.python.outputs.artifact-id }}
      allowed-paths: |
        pyproject.toml
        .pre-commit-config.yaml
        pylock.toml
        uv.lock
        tox.toml
        pyproject-fmt/pyproject.toml
        pyproject-fmt/tox.toml
        tox-toml-fmt/pyproject.toml
        tox-toml-fmt/tox.toml
        toml-fmt-common/pyproject.toml
        toml-fmt-common/tox.toml
      branch: update-python-dependencies
      title: Update Python dependencies
      body: Update dependency constraints from the scheduled scan.
      labels: skip news
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
  release-tools:
    name: 🔀 Upgrade release tools
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
