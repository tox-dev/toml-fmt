name: 🔀 update dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
jobs:
  python:
    name: 📦 Bump Python dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
      - name: 📦 Install tox
        run: uv tool install tox --with tox-uv
      - name: 📖 Generate README.rst
        run: |
          tox r -e readme -c pyproject-fmt
          tox r -e readme -c tox-toml-fmt
      - name: ⚙️ Set dependency age cutoff
        id: cutoff
        run: printf 'value=%s\n' "$(date --utc --date='7 days ago' '+%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
      - name: 📦 Bump dependencies
        env:
          CUTOFF: ${{ steps.cutoff.outputs.value }}
        run: |
          uvx 'bump-deps-index>=1.18' --exclude-newer "$CUTOFF" -i https://pypi.org/simple -f pyproject.toml tox.toml
          uvx 'bump-deps-index>=1.18' --exclude-newer "$CUTOFF" -i https://pypi.org/simple -f pyproject-fmt/pyproject.toml pyproject-fmt/tox.toml
          uvx 'bump-deps-index>=1.18' --exclude-newer "$CUTOFF" -i https://pypi.org/simple -f tox-toml-fmt/pyproject.toml tox-toml-fmt/tox.toml
          uvx 'bump-deps-index>=1.18' --exclude-newer "$CUTOFF" -i https://pypi.org/simple -f toml-fmt-common/pyproject.toml toml-fmt-common/tox.toml
      - name: 🔒 Refresh workspace lock
        env:
          UV_EXCLUDE_NEWER: ${{ steps.cutoff.outputs.value }}
        run: |
          uv lock --upgrade
      - name: 🔒 Make workspace lock usable without a cutoff
        run: uv lock
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@e406a30296cdc06197691769fd40843ddd8c7eb0 # 6.5.1
        with:
          groups: release-prepare
          venv: ${{ runner.temp }}/release-tools
      - name: 🧹 Run repository hooks
        run: '"$RUNNER_TEMP/release-tools/bin/prek" run --all-files'
      - name: 📝 Save the changes
        run: git diff HEAD --binary >"$RUNNER_TEMP/maintenance.patch"
      - name: 📤 Upload maintenance patch
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          if-no-files-found: error
  python-pr:
    name: 🔀 Open Python dependencies PR
    needs: python
    uses: tox-dev/github-workflows/.github/workflows/open-maintenance-pr.yaml@e406a30296cdc06197691769fd40843ddd8c7eb0 # 6.5.1
    with:
      artifact-id: ${{ needs.python.outputs.artifact-id }}
      allowed-paths: |
        pyproject.toml
        .pre-commit-config.yaml
        pylock.toml
        uv.lock
        tox.toml
        pyproject-fmt/pyproject.toml
        pyproject-fmt/tox.toml
        tox-toml-fmt/pyproject.toml
        tox-toml-fmt/tox.toml
        toml-fmt-common/pyproject.toml
        toml-fmt-common/tox.toml
      branch: update-python-dependencies
      title: Update Python dependencies
      body: Update dependency constraints from the scheduled scan.
      labels: skip news
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
  release-tools:
    name: 🔀 Upgrade release tools
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@e406a30296cdc06197691769fd40843ddd8c7eb0 # 6.5.1
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
