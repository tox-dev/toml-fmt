name: 📦 update dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
jobs:
  python:
    name: 🐍 python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: 🐍 Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
      - name: 🧪 Install tox
        run: uv tool install tox --with tox-uv
      - name: 📝 Generate README.rst
        run: |
          tox r -e readme -c pyproject-fmt
          tox r -e readme -c tox-toml-fmt
      - name: ⬆️ Bump dependencies
        run: |
          uvx bump-deps-index -i https://pypi.org/simple -f pyproject.toml tox.toml
          uvx bump-deps-index -i https://pypi.org/simple -f pyproject-fmt/pyproject.toml pyproject-fmt/tox.toml
          uvx bump-deps-index -i https://pypi.org/simple -f tox-toml-fmt/pyproject.toml tox-toml-fmt/tox.toml
          uvx bump-deps-index -i https://pypi.org/simple -f toml-fmt-common/pyproject.toml toml-fmt-common/tox.toml
      - name: 🔧 Fix workspace deps
        run: sed -i 's/toml-fmt-common>=.*/toml-fmt-common",/' pyproject-fmt/pyproject.toml tox-toml-fmt/pyproject.toml
      - name: Set dependency age cutoff
        run: printf 'UV_EXCLUDE_NEWER=%s\n' "$(date --utc --date='7 days ago' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Refresh workspace lock
        run: uv lock --upgrade
      - name: Refresh selectable project lock
        run: uvx --python 3.15 --from 'git+https://github.com/tox-dev/release-creator@d1d193f9b68d07344dd7a6a15d67970a1a2161e8' release-creator locks
      - name: 🎨 Run prek
        run: uv run --locked --python 3.15 --no-default-groups --group release prek run --all-files
      - name: Save the changes
        run: git diff HEAD --binary > "$RUNNER_TEMP/changes.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-patch
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
  python-pr:
    needs: python
    uses: $/.github/workflows/app-pr.yaml
    with:
      kind: python
      branch: update-python-dependencies
      title: Update Python dependencies
      body: Update dependency constraints from the scheduled scan.
    permissions:
      contents: read
  rust:
    name: 🦀 rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: ⬆️ Update Cargo.toml dependencies
        run: |
          cargo install cargo-edit
          cargo upgrade --incompatible
      - name: ⬆️ Update Cargo.lock
        run: cargo update
      - name: Save the changes
        run: git diff HEAD --binary > "$RUNNER_TEMP/changes.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-patch
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
  rust-pr:
    needs: rust
    uses: $/.github/workflows/app-pr.yaml
    with:
      kind: rust
      branch: update-rust-dependencies
      title: Update Rust dependencies
      body: Update Cargo manifests and the lockfile from the scheduled scan.
    permissions:
      contents: read
  release-tools:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@28517d3c24a52a2d7c325f3a4ffe4d93a2e786f5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      keep-uv-lock: true
      check-workflow: common.yaml
