name: 📦 update dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
jobs:
  python:
    name: 🐍 python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_CREATOR_CUTOFF: '2026-10-19T20:26:31Z'
      UV_BUILD_CUTOFF: '2026-10-20T15:11:07Z'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: 🐍 Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
      - name: 🧪 Install tox
        run: uv tool install tox --with tox-uv
      - name: 📝 Generate README.rst
        run: |
          tox r -e readme -c pyproject-fmt
          tox r -e readme -c tox-toml-fmt
      - name: ⬆️ Bump dependencies
        run: |
          uvx bump-deps-index -i https://pypi.org/simple -f pyproject.toml tox.toml
          uvx bump-deps-index -i https://pypi.org/simple -f pyproject-fmt/pyproject.toml pyproject-fmt/tox.toml
          uvx bump-deps-index -i https://pypi.org/simple -f tox-toml-fmt/pyproject.toml tox-toml-fmt/tox.toml
          uvx bump-deps-index -i https://pypi.org/simple -f toml-fmt-common/pyproject.toml toml-fmt-common/tox.toml
      - name: Set dependency age cutoff
        id: cutoff
        run: printf 'value=%s\n' "$(date --utc --date='7 days ago' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Refresh workspace lock
        env:
          UV_EXCLUDE_NEWER: ${{ steps.cutoff.outputs.value }}
        run: |
          uv lock --upgrade \
            --exclude-newer-package "release-creator=$RELEASE_CREATOR_CUTOFF" \
            --exclude-newer-package "uv-build=$UV_BUILD_CUTOFF"
      - name: Make workspace lock usable without a cutoff
        run: uv lock
      - name: Refresh selectable project lock
        env:
          UV_EXCLUDE_NEWER: ${{ steps.cutoff.outputs.value }}
        run: |
          uvx --python 3.15 \
            --from 'git+https://github.com/tox-dev/release-creator@a5873f5d66c5b1ff07da6294aa2719764fa9f864' \
            release-creator locks \
            --exclude-newer-package "release-creator=$RELEASE_CREATOR_CUTOFF" \
            --exclude-newer-package "uv-build=$UV_BUILD_CUTOFF"
      - name: Install the reviewed release tools
        run: uv sync --locked --python 3.15 --no-default-groups --group release
      - name: 🎨 Run prek
        env:
          UV_NO_SYNC: '1'
        run: .venv/bin/prek run --all-files
      - name: Save the changes
        run: git diff HEAD --binary > "$RUNNER_TEMP/changes.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-patch
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
  python-pr:
    needs: python
    uses: $/.github/workflows/app-pr.yaml
    with:
      kind: python
      branch: update-python-dependencies
      title: Update Python dependencies
      body: Update dependency constraints from the scheduled scan.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
  rust:
    name: 🦀 rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: ⬆️ Update Cargo.toml dependencies
        run: |
          cargo install cargo-edit
          cargo upgrade --incompatible
      - name: ⬆️ Update Cargo.lock
        run: cargo update
      - name: Save the changes
        run: git diff HEAD --binary > "$RUNNER_TEMP/changes.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-patch
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
  rust-pr:
    needs: rust
    uses: $/.github/workflows/app-pr.yaml
    with:
      kind: rust
      branch: update-rust-dependencies
      title: Update Rust dependencies
      body: Update Cargo manifests and the lockfile from the scheduled scan.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
  release-tools:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@8db87d4730353b61630d66cbc592d6bed0c85d2b
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      check-workflow: common.yaml
      exclude-newer-packages: |
        release-creator=2026-10-19T20:26:31Z
        uv-build=2026-10-20T15:11:07Z
