name: 📦 tox-toml-fmt
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "toml-doc/**"
      - "common/**"
      - "toml-fmt-common/**"
      - "tox-rules/**"
      - "tox-toml-fmt/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/tox_toml_fmt_build.yaml"
      - ".github/workflows/_build.yaml"
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: tox_toml_fmt_build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  changes:
    name: 🔍 changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔍 Check for changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            run:
              - 'toml-doc/**'
              - 'common/**'
              - 'toml-fmt-common/**'
              - 'tox-rules/**'
              - 'tox-toml-fmt/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/tox_toml_fmt_build.yaml'
              - '.github/workflows/_build.yaml'
  build:
    needs: changes
    uses: $/.github/workflows/_build.yaml
    with:
      package-name: tox-toml-fmt
      run: ${{ needs.changes.outputs.run }}
      release-build: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      pull-requests: read
