name: 🔀 python versions
on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"
permissions: {}
jobs:
  bump:
    name: 📦 Bump default Python versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
      - name: ⚙️ Update the default Python versions
        run: uv run tasks/python_versions.py
      - name: 🧹 Run prek
        run: uvx prek run --all-files
      - name: 📝 Save the changes
        id: patch
        run: |
          set -euo pipefail
          if git diff --quiet HEAD; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
            echo 'Maintenance patch skipped: no tracked file changed'
            exit 0
          fi
          git diff HEAD --binary >"$RUNNER_TEMP/maintenance.patch"
          echo 'changed=true' >>"$GITHUB_OUTPUT"
      - name: 📤 Upload maintenance patch
        id: upload
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          if-no-files-found: error
  bump-pr:
    name: 🔀 Open Python versions PR
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    uses: tox-dev/github-workflows/.github/workflows/open-maintenance-pr.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    with:
      artifact-id: ${{ needs.bump.outputs.artifact-id }}
      allowed-paths: |
        tasks/fmt_examples.py
        pyproject-fmt/pyproject.toml
        tox-toml-fmt/pyproject.toml
        pyproject-fmt/docs/configuration.rst
        pyproject-fmt/docs/formatting.rst
        pyproject-fmt/src/pyproject_fmt/__main__.py
      branch: update-python-versions
      title: Set the Python releases the defaults name
      body: Keep the default supported Python range aligned with published classifiers, release candidates, and supported cycles.
      labels: skip news
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
