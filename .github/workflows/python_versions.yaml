name: 🔀 python versions
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
permissions: {}
jobs:
  bump:
    name: 📦 Bump default Python versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
      - name: ⚙️ Update the default Python versions
        run: uv run tasks/python_versions.py
      - name: 🧹 Run prek
        run: uvx prek run --all-files
      - name: 📝 Save the changes
        run: git diff HEAD --binary >"$RUNNER_TEMP/maintenance.patch"
      - name: 📤 Upload maintenance patch
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          if-no-files-found: error
  bump-pr:
    name: 🔀 Open Python versions PR
    needs: bump
    uses: tox-dev/github-workflows/.github/workflows/open-maintenance-pr.yaml@e406a30296cdc06197691769fd40843ddd8c7eb0 # 6.5.1
    with:
      artifact-id: ${{ needs.bump.outputs.artifact-id }}
      allowed-paths: |
        tasks/fmt_examples.py
        pyproject-fmt/pyproject.toml
        tox-toml-fmt/pyproject.toml
        pyproject-fmt/docs/configuration.rst
        pyproject-fmt/docs/formatting.rst
        pyproject-fmt/src/pyproject_fmt/__main__.py
      branch: update-python-versions
      title: Set the Python releases the defaults name
      body: Keep the default supported Python range aligned with published classifiers, release candidates, and supported cycles.
      labels: skip news
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
