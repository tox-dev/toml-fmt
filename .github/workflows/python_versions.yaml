name: 🔀 python versions
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
permissions: {}
jobs:
  bump:
    name: 📦 Bump default Python versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
      - name: ⚙️ Update the default Python versions
        run: uv run tasks/python_versions.py
      - name: 🧹 Run prek
        run: uvx prek run --all-files
      - name: 📝 Save the changes
        run: git diff HEAD --binary >"$RUNNER_TEMP/changes.patch"
      - name: 📤 Upload versions patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: versions-patch
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
  bump-pr:
    name: 🔀 Open Python versions PR
    needs: bump
    uses: $/.github/workflows/app-pr.yaml
    with:
      kind: versions
      branch: update-python-versions
      title: Set the Python releases the defaults name
      body: Keep the default supported Python range aligned with published classifiers, release candidates, and supported cycles.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
