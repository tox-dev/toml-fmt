name: 🐍 python versions
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
permissions: {}
jobs:
  bump:
    name: ⬆️ bump
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
      - name: ⬆️ Set the releases the defaults name
        run: uv run tasks/python_versions.py
      - name: 🎨 Run prek
        run: uvx prek run --all-files
      - name: Save the changes
        run: git diff HEAD --binary > "$RUNNER_TEMP/changes.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: versions-patch
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
  bump-pr:
    needs: bump
    uses: $/.github/workflows/app-pr.yaml
    with:
      kind: versions
      branch: update-python-versions
      title: Set the Python releases the defaults name
      body: Keep the default supported Python range aligned with published classifiers, release candidates, and supported cycles.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
