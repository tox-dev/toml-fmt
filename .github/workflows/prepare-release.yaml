name: 🏷️ Prepare release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Distribution to release
        required: true
        type: choice
        options: [pyproject-fmt, tox-toml-fmt, toml-fmt-common]
      bump:
        description: Version increment
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
permissions: {}
concurrency:
  group: prepare-toml-fmt
  cancel-in-progress: false
jobs:
  prepare:
    name: 🏷️ Prepare release
    if: github.repository == 'tox-dev/toml-fmt'
    uses: tox-dev/github-workflows/.github/workflows/prepare-release-creator.yaml@211c2575e3dc9cce9a3e0dc1e2fdcd4a13f40abd # 6.5.3
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump }}
      package: ${{ inputs.package }}
      tag-format: "{package}/{version}"
      annotated: true
      cargo-set-version: ${{ inputs.package != 'toml-fmt-common' }}
      cargo-set-version-args: -p {package}
      assemble-command: |
        if [[ "$PACKAGE" == toml-fmt-common ]]; then
          uv version --package toml-fmt-common "$VERSION" --no-sync
        else
          uv run --project "$PACKAGE" python tasks/generate_readme.py "$PACKAGE"
        fi
        python3 tasks/assemble_release.py "$PACKAGE" "$VERSION"
      release-paths: |
        CHANGELOG.md
        Cargo.lock
        uv.lock
        toml-fmt-common/pyproject.toml
        {package}/Cargo.toml
        {package}/README.rst
        changelog.d/{package}/*
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
