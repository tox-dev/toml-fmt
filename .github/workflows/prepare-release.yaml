name: Prepare release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Distribution to release
        required: true
        type: choice
        options: [pyproject-fmt, tox-toml-fmt, toml-fmt-common]
      bump:
        description: Version increment
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
permissions: {}
concurrency:
  group: prepare-toml-fmt
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'tox-dev/toml-fmt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      patch-sha: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        if: inputs.package != 'toml-fmt-common'
        with:
          crate: cargo-edit
          version: 0.13.13
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Install locked release tools
        run: uv sync --locked --python 3.15 --no-default-groups --group release --no-install-workspace
      - name: Select the package version
        id: version
        env:
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          tag=$(git tag --list | .venv/bin/release-creator tags --package "$PACKAGE" --next "$BUMP")
          printf 'version=%s\ntag=%s\n' "${tag#"$PACKAGE/"}" "$tag" >>"$GITHUB_OUTPUT"
      - name: Link merged fragments and authors
        env:
          PACKAGE: ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/release-creator fragments --directory "changelog.d/$PACKAGE" --repository "$GITHUB_REPOSITORY" --git --resolve-authors
      - name: Bump the Rust distribution
        if: inputs.package != 'toml-fmt-common'
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo set-version -p "$PACKAGE" "$VERSION"
      - name: Bump the Python distribution
        if: inputs.package == 'toml-fmt-common'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv version --package toml-fmt-common "$VERSION" --no-sync
      - name: Regenerate the Rust distribution README
        if: inputs.package != 'toml-fmt-common'
        env:
          PACKAGE: ${{ inputs.package }}
        run: uv run --project "$PACKAGE" python tasks/generate_readme.py "$PACKAGE"
      - name: Assemble the package changelog
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .venv/bin/python tasks/assemble_release.py "$PACKAGE" "$VERSION"
      - name: Format the assembled changelog
        run: |
          .venv/bin/prek run mdformat --files CHANGELOG.md ||
            .venv/bin/prek run mdformat --files CHANGELOG.md
      - name: Check the rendered GitHub notes
        env:
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          .venv/bin/release-creator notes --changelog CHANGELOG.md --package "$PACKAGE" --tag "$TAG" --repository "$GITHUB_REPOSITORY" >"$RUNNER_TEMP/release-notes.md"
          grep -q '^### ' "$RUNNER_TEMP/release-notes.md"
      - name: Run repository hooks
        run: .venv/bin/prek run --all-files
      - name: Write the validated release patch
        id: patch
        run: |
          set -euo pipefail
          git diff --check
          git diff HEAD --binary >"$RUNNER_TEMP/release.patch"
          test -s "$RUNNER_TEMP/release.patch"
          read -r sha _ < <(sha256sum "$RUNNER_TEMP/release.patch")
          printf 'sha=%s\n' "$sha" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  push:
    needs: assemble
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - name: Verify the prepared source and patch
        env:
          PATCH_SHA: ${{ needs.assemble.outputs.patch-sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          read -r actual _ < <(sha256sum "$RUNNER_TEMP/release-patch/release.patch")
          test "$actual" = "$PATCH_SHA"
          git apply --check "$RUNNER_TEMP/release-patch/release.patch"
          git apply --index "$RUNNER_TEMP/release-patch/release.patch"
      - name: Check release patch paths and modes
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
            CHANGELOG.md | Cargo.lock | uv.lock | "$PACKAGE/Cargo.toml" | "$PACKAGE/README.rst" | toml-fmt-common/pyproject.toml | changelog.d/"$PACKAGE"/*.md) ;;
            *)
              echo "::error::unexpected release path: $path"
              exit 1
              ;;
            esac
          done < <(git diff --cached --name-only)
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            read -ra fields <<<"$metadata"
            if [[ "${fields[1]}" == 000000 && "${fields[4]}" == D && "$path" == changelog.d/"$PACKAGE"/*.md ]]; then
              continue
            fi
            if [[ "${fields[1]}" != 100644 ]]; then
              echo "::error::unexpected release file mode: $path"
              exit 1
            fi
          done < <(git diff --cached --raw --no-renames -z)
          grep -Fq "### $VERSION (" CHANGELOG.md
          git diff --cached --check
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: tox-dev/github-workflows/commit-and-tag@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          version: ${{ needs.assemble.outputs.tag }}
          token: ${{ steps.token.outputs.token }}
          app-slug: ${{ steps.token.outputs.app-slug }}
          message: release ${{ needs.assemble.outputs.tag }}
          annotated: 'true'
