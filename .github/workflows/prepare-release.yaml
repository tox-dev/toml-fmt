name: Prepare release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Distribution to release
        required: true
        type: choice
        options: [pyproject-fmt, tox-toml-fmt]
      bump:
        description: Version increment
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
permissions: {}
concurrency:
  group: prepare-toml-fmt
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'tox-dev/toml-fmt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-edit
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.15'
          enable-cache: false
      - name: Bump the selected package
        env:
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
        run: |
          cargo set-version -p "$PACKAGE" --bump "$BUMP"
          uv run --project "$PACKAGE" python tasks/generate_readme.py "$PACKAGE"
      - name: Assemble its changelog entry
        id: notes
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$PACKAGE/Cargo.toml" | head -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || -n "$(git tag --list "$PACKAGE/$version")" ]]; then
            echo "::error::invalid or existing version $PACKAGE/$version"
            exit 1
          fi
          mapfile -d '' fragments < <(find "changelog.d/$PACKAGE" -maxdepth 1 -type f -name '*.md' -print0 | sort -z)
          if (( ${#fragments[@]} == 0 )); then
            echo "::error::no $PACKAGE news fragments to release"
            exit 1
          fi
          for fragment in "${fragments[@]}"; do
            if [[ ! "$fragment" =~ ^changelog\.d/(pyproject-fmt|tox-toml-fmt)/[0-9]+\.(feature|bugfix|doc)\.md$ || ! -s "$fragment" ]]; then
              echo "::error::invalid or empty news fragment: $fragment"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          PACKAGE="$PACKAGE" VERSION="$version" python - <<'PY'
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          package = os.environ['PACKAGE']
          version = os.environ['VERSION']
          notes = '\n\n'.join(path.read_text().strip() for path in sorted(Path('changelog.d', package).glob('*.md')))
          changelog = Path('CHANGELOG.md')
          heading = f'## {package}\n\n'
          current = changelog.read_text()
          if heading not in current:
              raise SystemExit(f'No changelog history for {package}')
          entry = f'### {version} ({datetime.now(UTC):%Y-%m-%d})\n\n{notes}\n\n'
          changelog.write_text(current.replace(heading, heading + entry, 1))
          PY
          git rm -- "${fragments[@]}"
      - name: Check the release patch
        run: |
          uvx prek run --all-files
          git diff HEAD --binary > "$RUNNER_TEMP/release.patch"
          test -s "$RUNNER_TEMP/release.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  push:
    needs: assemble
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - name: Check and apply the release patch
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git apply --check "$RUNNER_TEMP/release-patch/release.patch"
          git apply --index "$RUNNER_TEMP/release-patch/release.patch"
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|Cargo.lock|"$PACKAGE/Cargo.toml"|"$PACKAGE/README.rst"|changelog.d/"$PACKAGE"/*.md) ;;
              *) echo "::error::unexpected release path: $path"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          grep -Fq "### $VERSION (" CHANGELOG.md
          git diff --cached --check
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Commit and tag the release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          set -euo pipefail
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "Prepare $PACKAGE/$VERSION"
          git tag -a "$PACKAGE/$VERSION" -m "Release $PACKAGE/$VERSION"
          gh auth setup-git --hostname github.com --force
          git push --atomic origin HEAD:main "refs/tags/$PACKAGE/$VERSION"
