name: Open maintenance PR
on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      branch:
        required: true
        type: string
      title:
        required: true
        type: string
      body:
        required: true
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
permissions: {}
jobs:
  open:
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.kind }}-patch
          path: ${{ runner.temp }}/maintenance
      - name: Apply the selected changes
        id: patch
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/maintenance/changes.patch"
          if [[ ! -s "$patch" ]]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git apply --check "$patch"
          git apply --index "$patch"
          echo "changed=true" >>"$GITHUB_OUTPUT"
      - name: Check Python maintenance paths
        if: steps.patch.outputs.changed == 'true' && inputs.kind == 'python'
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
            pyproject.toml | .pre-commit-config.yaml | pylock.toml | uv.lock | tox.toml | \
              pyproject-fmt/pyproject.toml | pyproject-fmt/tox.toml | \
              tox-toml-fmt/pyproject.toml | tox-toml-fmt/tox.toml | \
              toml-fmt-common/pyproject.toml | toml-fmt-common/tox.toml) ;;
            *)
              echo "::error::unexpected Python maintenance path: $path"
              exit 1
              ;;
            esac
          done < <(git diff --cached --name-only)
      - name: Check Rust maintenance paths
        if: steps.patch.outputs.changed == 'true' && inputs.kind == 'rust'
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
            Cargo.toml | Cargo.lock | common/Cargo.toml | pyproject-fmt/Cargo.toml | \
              toml-doc/Cargo.toml | tox-rules/Cargo.toml | tox-toml-fmt/Cargo.toml) ;;
            *)
              echo "::error::unexpected Rust maintenance path: $path"
              exit 1
              ;;
            esac
          done < <(git diff --cached --name-only)
      - name: Check Python version maintenance paths
        if: steps.patch.outputs.changed == 'true' && inputs.kind == 'versions'
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
            tasks/fmt_examples.py | pyproject-fmt/pyproject.toml | tox-toml-fmt/pyproject.toml | \
              pyproject-fmt/docs/configuration.rst | pyproject-fmt/docs/formatting.rst | \
              pyproject-fmt/src/pyproject_fmt/__main__.py) ;;
            *)
              echo "::error::unexpected Python version maintenance path: $path"
              exit 1
              ;;
            esac
          done < <(git diff --cached --name-only)
      - name: Check maintenance task kind
        if: steps.patch.outputs.changed == 'true'
        env:
          KIND: ${{ inputs.kind }}
        run: |
          case "$KIND" in
          python | rust | versions) ;;
          *)
            echo "::error::unknown maintenance task: $KIND"
            exit 1
            ;;
          esac
      - name: Check maintenance patch file modes
        if: steps.patch.outputs.changed == 'true'
        env:
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            read -ra fields <<<"$metadata"
            if [[ "${fields[1]}" != 100644 ]]; then
              echo "::error::unexpected $KIND file mode: $path"
              exit 1
            fi
          done < <(git diff --cached --raw --no-renames -z)
      - name: Check maintenance patch whitespace
        if: steps.patch.outputs.changed == 'true'
        run: git diff --cached --check
      - id: token
        if: steps.patch.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - if: steps.patch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          commit-message: ${{ inputs.title }}
          title: ${{ inputs.title }}
          body: ${{ inputs.body }}
          labels: skip news
          delete-branch: true
