name: Label bot news
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Reads PR metadata without checking out PR code.
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  label:
    if: github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          fragments: changelog.d/pyproject-fmt,changelog.d/tox-toml-fmt,changelog.d/toml-fmt-common
