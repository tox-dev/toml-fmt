name: Label bot news
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Reads PR metadata without checking out PR code.
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  label:
    if: github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@9a4e76e2f4901856f2784f6c0efc89278c518b1f
        with:
          fragments: changelog.d/pyproject-fmt,changelog.d/tox-toml-fmt,changelog.d/toml-fmt-common
