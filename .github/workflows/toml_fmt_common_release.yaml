name: 🚀 toml-fmt-common
on:
  push:
    tags: ["toml-fmt-common/*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notes:
    name: 📝 Render GitHub Release notes
    needs: build
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      changelog: CHANGELOG.md
      package: toml-fmt-common
      artifact-url: https://pypi.org/project/toml-fmt-common/${{ needs.build.outputs.version }}/
  build:
    name: 🏗️ Build distributions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: ⚙️ Read package version
        id: version
        run: printf 'version=%s\n' "$(uv version --package toml-fmt-common --short)" >>"$GITHUB_OUTPUT"
      - name: 📦 Export locked build constraints
        id: constraints
        uses: tox-dev/github-workflows/export-build-constraints@6.8.0
      - name: 🏗️ Build source and wheel distributions
        run: |
          uv build --python 3.15 --python-preference only-managed \
            --build-constraints "$BUILD_CONSTRAINTS" --sdist --wheel toml-fmt-common --out-dir dist
        env:
          BUILD_CONSTRAINTS: ${{ steps.constraints.outputs.path }}
          UV_REQUIRE_BUILD_HASHES: "true"
      - name: 📤 Upload distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: toml-fmt-common-wheels-universal
          path: dist/*
          if-no-files-found: error
  pypi:
    name: 🚀 Publish to PyPI
    if: github.repository == 'tox-dev/toml-fmt'
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/toml-fmt-common/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: toml-fmt-common-wheels-*
          path: dist
          merge-multiple: true
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [build, pypi, notes]
    uses: tox-dev/github-workflows/.github/workflows/github-release.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: write
    with:
      project: toml-fmt-common
      version: ${{ needs.build.outputs.version }}
      tag: ${{ github.ref_name }}
      artifact-pattern: toml-fmt-common-wheels-*
      notes-artifact-id: ${{ needs.notes.outputs.artifact-id }}
