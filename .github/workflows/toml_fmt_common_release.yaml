name: 🚀 toml-fmt-common
on:
  push:
    tags: ["toml-fmt-common/*"]
permissions: {}
concurrency:
  group: release-toml-fmt-common-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Read package version
        id: version
        run: printf 'version=%s\n' "$(uv version --package toml-fmt-common --short)" >>"$GITHUB_OUTPUT"
      - name: Export locked build constraints
        id: constraints
        uses: tox-dev/github-workflows/export-build-constraints@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
      - name: Build source and wheel distributions
        run: |
          uv build --python 3.15 --python-preference only-managed \
            --build-constraints "$BUILD_CONSTRAINTS" --sdist --wheel toml-fmt-common --out-dir dist
        env:
          BUILD_CONSTRAINTS: ${{ steps.constraints.outputs.path }}
          UV_REQUIRE_BUILD_HASHES: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toml-fmt-common-wheels-universal
          path: dist/*
          if-no-files-found: error
  validate:
    if: github.repository == 'tox-dev/toml-fmt' && startsWith(github.ref, 'refs/tags/toml-fmt-common/')
    needs: build
    uses: $/.github/workflows/_validate_package.yaml
    permissions:
      contents: read
    with:
      package: toml-fmt-common
      version: ${{ needs.build.outputs.version }}
      artifact-pattern: toml-fmt-common-wheels-*
  github-draft:
    if: github.repository == 'tox-dev/toml-fmt'
    needs: [build, validate]
    uses: $/.github/workflows/_github_package_release.yaml
    permissions:
      contents: write
    with:
      package: toml-fmt-common
      version: ${{ needs.build.outputs.version }}
      phase: stage
  pypi:
    needs:
      - build
      - validate
      - github-draft
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/toml-fmt-common/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check publication artifact references
        env:
          DIST_ID: ${{ needs.validate.outputs.dist-artifact-id }}
          MANIFEST_ID: ${{ needs.validate.outputs.manifest-artifact-id }}
        run: test -n "$DIST_ID" && test -n "$MANIFEST_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.dist-artifact-id }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.manifest-artifact-id }}
          path: ${{ runner.temp }}/release-manifest
      - name: Check uploaded distribution hashes
        working-directory: dist
        run: sha256sum --check --strict "$RUNNER_TEMP/release-manifest/dist.sha256"
      - name: Check uploaded distribution count
        env:
          MANIFEST: ${{ runner.temp }}/release-manifest/dist.sha256
        run: >-
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq "$(wc -l <"$MANIFEST")"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
  verify:
    needs:
      - build
      - validate
      - pypi
    uses: $/.github/workflows/_reconcile_package.yaml
    permissions:
      contents: read
    with:
      package: toml-fmt-common
      version: ${{ needs.build.outputs.version }}
      dist-artifact-id: ${{ needs.validate.outputs.dist-artifact-id }}
      manifest-artifact-id: ${{ needs.validate.outputs.manifest-artifact-id }}
  github-release:
    needs: [build, verify, github-draft]
    uses: $/.github/workflows/_github_package_release.yaml
    permissions:
      contents: write
    with:
      package: toml-fmt-common
      version: ${{ needs.build.outputs.version }}
      phase: publish
      notes-sha: ${{ needs.github-draft.outputs.notes-sha }}
      notes-artifact-id: ${{ needs.github-draft.outputs.notes-artifact-id }}
