name: 🚀 toml-fmt-common
on:
  push:
    tags: ["toml-fmt-common/*"]
permissions: {}
concurrency:
  group: release-toml-fmt-common-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      BUILD_CONSTRAINTS: ${{ runner.temp }}/build-constraints.txt
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Read package version
        id: version
        run: printf 'version=%s\n' "$(uv version --package toml-fmt-common --short)" >> "$GITHUB_OUTPUT"
      - name: Export locked build constraints
        run: |
          uv export --locked --format requirements-txt --no-default-groups \
            --only-group release --no-emit-workspace --output-file "$BUILD_CONSTRAINTS"
      - name: Build source and wheel distributions
        run: |
          uv build --python 3.15 --python-preference only-managed \
            --build-constraints "$BUILD_CONSTRAINTS" --sdist --wheel toml-fmt-common --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toml-fmt-common-wheels-universal
          path: dist/*
          if-no-files-found: error
  validate:
    if: github.repository == 'tox-dev/toml-fmt' && startsWith(github.ref, 'refs/tags/toml-fmt-common/')
    needs: build
    uses: $/.github/workflows/_validate_package.yaml
    permissions:
      contents: read
    with:
      package: toml-fmt-common
      version: ${{ needs.build.outputs.version }}
      artifact-pattern: toml-fmt-common-wheels-*
  stage:
    if: github.repository == 'tox-dev/toml-fmt'
    needs: [build, validate]
    uses: $/.github/workflows/_reconcile_package.yaml
    permissions:
      contents: read
    with:
      package: toml-fmt-common
      version: ${{ needs.build.outputs.version }}
      mode: stage
  pypi:
    if: needs.stage.outputs.missing-count != '0'
    needs: [build, stage]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/toml-fmt-common/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toml-fmt-common-validated-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toml-fmt-common-validated-manifest
          path: ${{ runner.temp }}/release-manifest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toml-fmt-common-missing-manifest
          path: ${{ runner.temp }}/missing-manifest
      - name: Check uploaded distribution hashes
        working-directory: dist
        run: sha256sum --check --strict "$RUNNER_TEMP/release-manifest/dist.sha256"
      - name: Check uploaded distribution count
        env:
          MANIFEST: ${{ runner.temp }}/release-manifest/dist.sha256
        run: >-
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq "$(wc -l < "$MANIFEST")"
      - uses: tox-dev/github-workflows/select-pypi-artifacts@a250ca3524857236e288764651851010939b6f71
        with:
          dist: dist
          manifest: ${{ runner.temp }}/missing-manifest/pypi-missing-names.txt
          output-dir: publish-dist
          expected-count: ${{ needs.stage.outputs.missing-count }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist
  verify:
    needs: [build, stage, pypi]
    if: always() && needs.stage.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.pypi.result)
    uses: $/.github/workflows/_reconcile_package.yaml
    permissions:
      contents: read
    with:
      package: toml-fmt-common
      version: ${{ needs.build.outputs.version }}
      mode: verify
  github-release:
    needs: [build, verify]
    uses: $/.github/workflows/_github_package_release.yaml
    permissions:
      contents: write
    with:
      package: toml-fmt-common
      version: ${{ needs.build.outputs.version }}
