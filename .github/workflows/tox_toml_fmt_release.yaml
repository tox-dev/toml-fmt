name: 🚀 tox-toml-fmt
on:
  push:
    tags: ["tox-toml-fmt/*"]
permissions: {}
concurrency:
  group: release-tox-toml-fmt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: $/.github/workflows/tox_toml_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  publish:
    if: github.repository == 'tox-dev/toml-fmt' && startsWith(github.ref, 'refs/tags/tox-toml-fmt/')
    needs: build
    uses: $/.github/workflows/_publish_package.yaml
    permissions:
      contents: write
      id-token: write
    with:
      package: tox-toml-fmt
      version: ${{ needs.build.outputs.version }}
      artifact-pattern: tox-toml-fmt-wheels-*
