name: 🚀 tox-toml-fmt
on:
  push:
    tags: ["tox-toml-fmt/*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: 🏷️ Read release version
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🏷️ Strip the package prefix from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: printf 'version=%s\n' "${TAG#tox-toml-fmt/}" >>"$GITHUB_OUTPUT"
  notes:
    name: 📝 Render GitHub Release notes
    needs: version
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      changelog: CHANGELOG.md
      package: tox-toml-fmt
      artifact-url: https://pypi.org/project/tox-toml-fmt/${{ needs.version.outputs.version }}/
  build:
    name: 🏗️ Build distributions
    uses: $/.github/workflows/tox_toml_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  pypi:
    name: 🚀 Publish to PyPI
    if: github.repository == 'tox-dev/toml-fmt'
    needs: [version, build, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/tox-toml-fmt/${{ needs.version.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: tox-toml-fmt-wheels-*
          path: dist
          merge-multiple: true
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [version, build, pypi, notes]
    uses: tox-dev/github-workflows/.github/workflows/github-release.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: write
    with:
      project: tox-toml-fmt
      version: ${{ needs.version.outputs.version }}
      tag: ${{ github.ref_name }}
      artifact-pattern: tox-toml-fmt-wheels-*
      notes-artifact-id: ${{ needs.notes.outputs.artifact-id }}
  pre-commit-mirror:
    name: 🪞 Update the pre-commit mirror
    if: github.repository == 'tox-dev/toml-fmt'
    needs: [version, github-release]
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions: {}
    steps:
      - name: 🔑 Create release App token
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: tox-toml-fmt
          permission-contents: write
      # The mirror reads the newest version from PyPI, so it starts once the release is published there.
      - name: 🪞 Start the mirror
        run: gh api "repos/${GITHUB_REPOSITORY_OWNER}/tox-toml-fmt/dispatches" -f event_type=release -f "client_payload[version]=${VERSION}"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
