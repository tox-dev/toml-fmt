name: 🚀 tox-toml-fmt
on:
  push:
    tags: ["tox-toml-fmt/*"]
permissions: {}
concurrency:
  group: release-tox-toml-fmt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: $/.github/workflows/tox_toml_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  release:
    name: 🚀 release
    if: github.repository == 'tox-dev/toml-fmt' && startsWith(github.ref, 'refs/tags/tox-toml-fmt/')
    needs: [build]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/project/tox-toml-fmt/${{ needs.build.outputs.version }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: 📥 Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 📝 Require release notes
        env:
          PACKAGE: tox-toml-fmt
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          source_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$PACKAGE/Cargo.toml" | head -n 1)
          if [[ "$TAG" != "$PACKAGE/$VERSION" || "$VERSION" != "$source_version" ]]; then
            echo "::error::$TAG does not match the $PACKAGE source version $source_version"
            exit 1
          fi
          awk -v project="$PACKAGE" -v version="$VERSION" '
            $0 == "## " project { in_project = 1; next }
            in_project && /^## / { exit }
            in_project && /^### / {
              if (found) exit
              found = index($0, "### " version " (") == 1
              next
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "::error::$TAG has no changelog entry"
            exit 1
          fi
          printf '\n[PyPI release](https://pypi.org/project/%s/%s/)\n' "$PACKAGE" "$VERSION" >> "$RUNNER_TEMP/release-notes.md"
          previous=$(git tag --list "$PACKAGE/*" | sort -V | awk -v tag="$TAG" '$0 == tag { print previous; exit } { previous = $0 }')
          if [[ -n "$previous" ]]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "${previous//\//%2F}" "${TAG//\//%2F}" >> "$RUNNER_TEMP/release-notes.md"
          else
            printf '\n**Full Changelog**: https://github.com/%s/commits/%s\n' "$GITHUB_REPOSITORY" "${TAG//\//%2F}" >> "$RUNNER_TEMP/release-notes.md"
          fi
      - name: 📥 Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tox-toml-fmt-wheels-*
          path: dist
          merge-multiple: "true"
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
      - name: 📢 Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md"
