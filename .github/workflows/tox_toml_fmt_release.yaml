name: 🚀 tox-toml-fmt
on:
  push:
    tags: ["tox-toml-fmt/*"]
permissions: {}
concurrency:
  group: release-tox-toml-fmt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: $/.github/workflows/tox_toml_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  validate:
    needs: build
    uses: $/.github/workflows/_validate_package.yaml
    permissions:
      contents: read
    with:
      package: tox-toml-fmt
      version: ${{ needs.build.outputs.version }}
      artifact-pattern: tox-toml-fmt-wheels-*
  github-draft:
    if: github.repository == 'tox-dev/toml-fmt'
    needs: [build, validate]
    uses: $/.github/workflows/_github_package_release.yaml
    permissions:
      contents: write
    with:
      package: tox-toml-fmt
      version: ${{ needs.build.outputs.version }}
      phase: stage
  pypi:
    needs:
      - build
      - validate
      - github-draft
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/tox-toml-fmt/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check publication artifact references
        env:
          DIST_ID: ${{ needs.validate.outputs.dist-artifact-id }}
          MANIFEST_ID: ${{ needs.validate.outputs.manifest-artifact-id }}
        run: test -n "$DIST_ID" && test -n "$MANIFEST_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.dist-artifact-id }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.manifest-artifact-id }}
          path: ${{ runner.temp }}/release-manifest
      - name: Check uploaded distribution hashes
        working-directory: dist
        run: sha256sum --check --strict "$RUNNER_TEMP/release-manifest/dist.sha256"
      - name: Check uploaded distribution count
        env:
          MANIFEST: ${{ runner.temp }}/release-manifest/dist.sha256
        run: >-
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq "$(wc -l <"$MANIFEST")"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
  verify:
    needs:
      - build
      - validate
      - pypi
    uses: $/.github/workflows/_reconcile_package.yaml
    permissions:
      contents: read
    with:
      package: tox-toml-fmt
      version: ${{ needs.build.outputs.version }}
      dist-artifact-id: ${{ needs.validate.outputs.dist-artifact-id }}
      manifest-artifact-id: ${{ needs.validate.outputs.manifest-artifact-id }}
  github-release:
    needs: [build, verify, github-draft]
    uses: $/.github/workflows/_github_package_release.yaml
    permissions:
      contents: write
    with:
      package: tox-toml-fmt
      version: ${{ needs.build.outputs.version }}
      phase: publish
      notes-sha: ${{ needs.github-draft.outputs.notes-sha }}
      notes-artifact-id: ${{ needs.github-draft.outputs.notes-artifact-id }}
