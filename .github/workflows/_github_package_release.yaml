name: Create package GitHub Release
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      version:
        required: true
        type: string
permissions: {}
jobs:
  previous:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Install locked release tools
        run: uv sync --locked --python 3.15 --no-default-groups --only-group release --no-install-workspace
      - name: Select previous package tag
        id: previous
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          previous=$(git tag --list | uvx --python 3.15 --from 'git+https://github.com/tox-dev/release-creator@7db94b1b86ee6559f22970f605a0eef7c4bff02e' release-creator tags "$VERSION" --previous --package "$PACKAGE")
          if [[ -n "$previous" ]]; then
            printf 'tag=%s\n' "$previous" >> "$GITHUB_OUTPUT"
          fi
  contributors:
    needs: previous
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Read GitHub contributor metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous.outputs.tag }}
        run: |
          args=(-f "tag_name=$TAG")
          if [[ -n "$PREVIOUS" ]]; then
            args+=(-f "previous_tag_name=$PREVIOUS")
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/generated-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-generated-notes
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  notes:
    needs: [previous, contributors]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.digest.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Install locked release tools
        run: uv sync --locked --python 3.15 --no-default-groups --only-group release --no-install-workspace
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-generated-notes
          path: ${{ runner.temp }}
      - name: Render package release notes
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous.outputs.tag }}
        run: |
          args=(--changelog CHANGELOG.md --package "$PACKAGE" --tag "$TAG" --repository "$GITHUB_REPOSITORY" --artifact-url "https://pypi.org/project/$PACKAGE/$VERSION/" --generated-notes "$RUNNER_TEMP/generated-notes.md")
          if [[ -n "$PREVIOUS" ]]; then
            args+=(--previous "$PREVIOUS")
          fi
          .venv/bin/release-creator notes "${args[@]}" > "$RUNNER_TEMP/release-notes.md"
      - name: Record the release notes hash
        id: digest
        run: printf 'sha=%s\n' "$(sha256sum "$RUNNER_TEMP/release-notes.md" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  publish:
    needs: notes
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-release-notes
          path: ${{ runner.temp }}
      - name: Verify the release notes hash
        env:
          NOTES_SHA: ${{ needs.notes.outputs.sha }}
        run: printf '%s  %s\n' "$NOTES_SHA" "$RUNNER_TEMP/release-notes.md" | sha256sum --check --status
      - name: Reconcile GitHub Release
        uses: tox-dev/github-workflows/publish-github-release@a250ca3524857236e288764651851010939b6f71
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
