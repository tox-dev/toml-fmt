on:
  workflow_call:
    inputs:
      package-name:
        required: true
        type: string
        description: "Package name (e.g. pyproject-fmt)"
      run:
        required: false
        type: string
        default: "true"
        description: "When 'false', skip the build jobs but still post the aggregate gate"
      release-build:
        required: false
        type: boolean
        default: false
        description: Build the exact version from a protected release tag
    outputs:
      version:
        value: ${{ jobs.bump.outputs.version }}
permissions:
  contents: read
env:
  # our in-tree build_backend wraps maturin; silence its missing-backend warning
  MATURIN_NO_MISSING_BUILD_BACKEND_WARNING: "1"
jobs:
  bump:
    name: 🏷️ Bump version
    if: ${{ inputs.run == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      maturin-version: ${{ steps.maturin.outputs.version }}
      source-date-epoch: ${{ steps.source-date-epoch.outputs.value }}
      source-artifact-id: ${{ steps.source.outputs.artifact-id }}
    steps:
      - name: 🦀 Install Rust toolchain
        if: ${{ !inputs.release-build }}
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: 🦀 Install cargo-edit
        if: ${{ !inputs.release-build }}
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-edit
          version: 0.13.13
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⚙️ Read source timestamp
        id: source-date-epoch
        run: echo "value=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        env:
          UV_VENV_SEED: "true"
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: 📦 Install locked build tool
        uses: tox-dev/github-workflows/install-locked-tools@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
        with:
          groups: release-build
          venv: ${{ runner.temp }}/release-tools
      - name: ⚙️ Read locked maturin version
        id: maturin
        run: |
          version=$("$RUNNER_TEMP/release-tools/bin/maturin" --version)
          printf 'version=v%s\n' "${version#maturin }" >>"$GITHUB_OUTPUT"
      - name: 🏷️ Bump version
        if: ${{ !inputs.release-build }}
        run: cargo set-version -p "$PACKAGE" --bump "$RELEASE_TYPE"
        env:
          PACKAGE: ${{ inputs.package-name }}
          RELEASE_TYPE: ${{ github.event.inputs.release != null && github.event.inputs.release != 'no' && github.event.inputs.release || 'patch' }}
      - name: ⚙️ Read package version
        id: version
        env:
          PACKAGE: ${{ inputs.package-name }}
        run: |
          version=$(python3 tasks/cargo_version.py "$PACKAGE/Cargo.toml")
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: 🧹 Run pre-commit
        if: ${{ !inputs.release-build }}
        uses: tox-dev/action-pre-commit-uv@4de52c139ed1a6963bcc4c30042c4ef9d75d8b11 # v1.1.0
        continue-on-error: true
      - name: 📖 Generate README.rst
        if: ${{ !inputs.release-build }}
        run: uv run --project "$PACKAGE" python tasks/generate_readme.py "$PACKAGE"
        env:
          PACKAGE: ${{ inputs.package-name }}
      - name: 🔍 Show changes
        if: ${{ !inputs.release-build }}
        run: git diff HEAD -u
      - name: 📤 Upload source
        id: source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.package-name }}-source
          path: |
            .
            !.git
          compression-level: 9
          retention-days: 1
          if-no-files-found: "error"
  linux:
    name: 🏗️ ${{ matrix.platform.target }}${{ matrix.platform.suffix || '' }}
    needs: [bump]
    runs-on: ${{ matrix.platform.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: ubuntu-24.04, target: x86_64, manylinux: "2_28", interpreter: "3.15 3.14t pypy3.11"}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, interpreter: "3.15 3.14t"}
          - {runner: ubuntu-24.04, target: aarch64, manylinux: "2_28", zig: true, interpreter: "3.15 3.14t"}
          - {runner: ubuntu-24.04, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, zig: true, interpreter: "3.15 3.14t"}
          - {runner: ubuntu-24.04, target: riscv64gc-unknown-linux-gnu, manylinux: "2_31"}
          # 3.15t needs explicit no-abi3 build (PEP 803 incomplete in 3.15.0a8)
          - {runner: ubuntu-24.04, target: x86_64, manylinux: "2_28", interpreter: "3.15t", extra: "--no-default-features --features extension-module", suffix: "-315t"}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, interpreter: "3.15t", extra: "--no-default-features --features extension-module", suffix: "-315t"}
          - {runner: ubuntu-24.04, target: aarch64, manylinux: "2_28", zig: true, interpreter: "3.15t", extra: "--no-default-features --features extension-module", suffix: "-315t"}
          - {runner: ubuntu-24.04, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, zig: true, interpreter: "3.15t", extra: "--no-default-features --features extension-module", suffix: "-315t"}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: 🏗️ Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: -m ${{ inputs.package-name }}/Cargo.toml --locked --release --out dist --interpreter ${{ matrix.platform.interpreter || '3.15' }} ${{ matrix.platform.extra || '' }} --target-dir target ${{ matrix.platform.zig && '--zig' || '' }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env SOURCE_DATE_EPOCH
          sccache: ${{ !inputs.release-build }}
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          ignore-empty-workdir: true
          version: latest-known
          python-version: "3.15"
      - name: 🏗️ Vendor toml-fmt-common into wheels
        # maturin build (run by maturin-action) skips PEP 517, so vendor via the backend's CLI
        run: uv run --no-project "$PACKAGE/build_backend.py" dist
        shell: bash
        env:
          PACKAGE: ${{ inputs.package-name }}
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.package-name }}-wheels-linux-${{ matrix.platform.target }}${{ matrix.platform.suffix || '' }}
          path: dist
  windows:
    name: 🏗️ ${{ matrix.platform.target }}
    needs: [bump]
    runs-on: ${{ matrix.platform.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: windows-2025, target: x64, interpreter: "3.15 3.14t", python: "3.15"}
          - {runner: windows-11-arm, target: aarch64, interpreter: "3.15 3.14t", python: "3.15"}
          - {runner: windows-2025, target: x64, interpreter: "3.15t", python: "3.15", extra: "--no-default-features --features extension-module", suffix: "-315t"}
          - {runner: windows-11-arm, target: aarch64, interpreter: "3.15t", python: "3.15", extra: "--no-default-features --features extension-module", suffix: "-315t"}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        env:
          UV_VENV_SEED: "true"
        with:
          ignore-empty-workdir: true
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: ${{ matrix.platform.python }}
      - name: 🏗️ Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: -m ${{ inputs.package-name }}/Cargo.toml --locked --release --out dist --interpreter ${{ matrix.platform.interpreter || '3.15' }} ${{ matrix.platform.extra || '' }} --target-dir target
          sccache: ${{ !inputs.release-build }}
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          ignore-empty-workdir: true
          version: latest-known
          python-version: "3.15"
      - name: 🏗️ Vendor toml-fmt-common into wheels
        # maturin build (run by maturin-action) skips PEP 517, so vendor via the backend's CLI
        run: uv run --no-project "$PACKAGE/build_backend.py" dist
        shell: bash
        env:
          PACKAGE: ${{ inputs.package-name }}
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.package-name }}-wheels-windows-${{ matrix.platform.target }}${{ matrix.platform.suffix || '' }}
          path: dist
  macos:
    name: 🏗️ ${{ matrix.platform.target }}${{ matrix.platform.suffix || '' }}
    needs: [bump]
    runs-on: ${{ matrix.platform.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: macos-15, target: x86_64, interpreter: "3.15 3.14t pypy3.11"}
          - {runner: macos-15, target: aarch64, interpreter: "3.15 3.14t pypy3.11"}
          - {runner: macos-15, target: x86_64, interpreter: "3.15t", extra: "--no-default-features --features extension-module", suffix: "-315t"}
          - {runner: macos-15, target: aarch64, interpreter: "3.15t", extra: "--no-default-features --features extension-module", suffix: "-315t"}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: 🏗️ Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: -m ${{ inputs.package-name }}/Cargo.toml --locked --release --out dist --interpreter ${{ matrix.platform.interpreter }} ${{ matrix.platform.extra || '' }} --target-dir target
          sccache: ${{ !inputs.release-build }}
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          ignore-empty-workdir: true
          version: latest-known
          python-version: "3.15"
      - name: 🏗️ Vendor toml-fmt-common into wheels
        # maturin build (run by maturin-action) skips PEP 517, so vendor via the backend's CLI
        run: uv run --no-project "$PACKAGE/build_backend.py" dist
        shell: bash
        env:
          PACKAGE: ${{ inputs.package-name }}
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.package-name }}-wheels-macos-${{ matrix.platform.target }}${{ matrix.platform.suffix || '' }}
          path: dist
  sdist:
    name: 🏗️ sdist
    needs: [bump]
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          ignore-empty-workdir: true
          version: latest-known
          python-version: "3.15"
      - name: 📦 Export locked build constraints
        id: constraints
        uses: tox-dev/github-workflows/export-build-constraints@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
      - name: 🏗️ Build sdist
        # an sdist compiles nothing, so it goes through PEP 517 and the backend vendors toml-fmt-common
        run: uv build --build-constraints "$BUILD_CONSTRAINTS" --sdist --out-dir dist "$PACKAGE"
        shell: bash
        env:
          BUILD_CONSTRAINTS: ${{ steps.constraints.outputs.path }}
          PACKAGE: ${{ inputs.package-name }}
          UV_REQUIRE_BUILD_HASHES: "true"
      - name: 📤 Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.package-name }}-wheels-sdist
          path: dist
  all-pass:
    name: 🚦 ${{ inputs.package-name }}-build
    if: always()
    needs: [bump, linux, windows, macos, sdist]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Decide whether all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were canceled"
            exit 1
          fi
          echo "All jobs passed or were skipped"
