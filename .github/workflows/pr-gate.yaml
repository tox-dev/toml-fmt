name: PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: {}
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  news:
    name: News fragment
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a package changelog entry
        env:
          SKIP_NEWS: ${{ contains(github.event.pull_request.labels.*.name, 'skip news') }}
          BOT_AUTHOR: ${{ github.event.pull_request.user.type == 'Bot' }}
        run: |
          set -euo pipefail
          pyproject_required=0
          tox_required=0
          common_required=0
          pyproject_found=0
          tox_found=0
          common_found=0
          fragments=0
          while IFS= read -r path; do
            case "$path" in
              pyproject-fmt/*) pyproject_required=1 ;;
              tox-toml-fmt/*) tox_required=1 ;;
              toml-fmt-common/*) common_required=1 ;;
              common/*|toml-doc/*|tox-rules/*|Cargo.toml|Cargo.lock)
                pyproject_required=1
                tox_required=1
                ;;
            esac
            case "$path" in
              changelog.d/pyproject-fmt/*.*.md) pyproject_found=1; fragments=$((fragments + 1)) ;;
              changelog.d/tox-toml-fmt/*.*.md) tox_found=1; fragments=$((fragments + 1)) ;;
              changelog.d/toml-fmt-common/*.*.md) common_found=1; fragments=$((fragments + 1)) ;;
              *) continue ;;
            esac
            name=${path##*/}
            category=${name%.md}
            category=${category##*.}
            case "$category" in
              feature|change|bugfix|doc|breaking|security|performance|deprecation|removal|packaging) ;;
              *) echo "::error::unknown changelog category: $path"; exit 1 ;;
            esac
            stem=${name%.*.*}
            valid_name=false
            if [[ "$stem" == +?* && "${stem#+}" != *[!a-zA-Z0-9-]* ]] ||
              [[ -n "$stem" && "$stem" != *[!0-9]* ]]; then
              valid_name=true
            fi
            if [[ "$valid_name" == false || ! -s "$path" ]]; then
              echo "::error::invalid or empty changelog fragment: $path"
              exit 1
            fi
          done < <(git diff --diff-filter=AM --name-only "origin/$GITHUB_BASE_REF"...HEAD)
          if [[ "$SKIP_NEWS" == true || "$BOT_AUTHOR" == true ]]; then
            exit 0
          fi
          if (( (pyproject_required && !pyproject_found) || (tox_required && !tox_found) ||
            (common_required && !common_found) || (!fragments) )); then
            echo "::error::add package changelog fragments or apply skip news"
            exit 1
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Install locked release tools
        run: uv sync --locked --python 3.15 --no-default-groups --group release --no-install-workspace
      - name: Check assembled package news
        run: |
          set -euo pipefail
          for package in pyproject-fmt tox-toml-fmt toml-fmt-common; do
            fragments=(changelog.d/"$package"/*.md)
            if [[ -f "${fragments[0]}" ]]; then
              .venv/bin/python tasks/assemble_release.py "$package" 0.0.0
            fi
          done
  common:
    uses: $/.github/workflows/common.yaml
    permissions:
      contents: read
  toml-doc:
    uses: $/.github/workflows/toml_doc.yaml
    permissions:
      contents: read
  shared-build:
    uses: $/.github/workflows/toml_fmt_common_build.yaml
    permissions:
      contents: read
  shared-test:
    uses: $/.github/workflows/toml_fmt_common_test.yaml
    permissions:
      contents: read
  pyproject-build:
    uses: $/.github/workflows/pyproject_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  pyproject-test:
    uses: $/.github/workflows/pyproject_fmt_test.yaml
    permissions:
      contents: read
  tox-build:
    uses: $/.github/workflows/tox_toml_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  tox-test:
    uses: $/.github/workflows/tox_toml_fmt_test.yaml
    permissions:
      contents: read
  gate:
    name: Required checks pass
    if: always()
    needs: [news, common, toml-doc, shared-build, shared-test, pyproject-build, pyproject-test, tox-build, tox-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(to_entries[]; .value.result == "success")' <<< "$NEEDS_JSON"
