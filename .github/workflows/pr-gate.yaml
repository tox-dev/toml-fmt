name: 🚦 PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tasks:
    name: 🧪 Maintenance tasks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: 📦 Install current test tools
        run: |
          uv venv --python 3.15 .venv
          uv pip install --python .venv/bin/python --group pyproject-fmt/pyproject.toml:test
      - name: 🧪 Test maintenance tasks
        env:
          PYTHONPATH: .:tasks
        run: .venv/bin/python -m pytest -q tests/tasks
  common:
    name: 🧪 common
    uses: $/.github/workflows/common.yaml
    permissions:
      contents: read
  toml-doc:
    name: 🧪 toml-doc
    uses: $/.github/workflows/toml_doc.yaml
    permissions:
      contents: read
  shared-build:
    name: 🏗️ toml-fmt-common build
    uses: $/.github/workflows/toml_fmt_common_build.yaml
    permissions:
      contents: read
  shared-test:
    name: 🧪 toml-fmt-common tests
    uses: $/.github/workflows/toml_fmt_common_test.yaml
    permissions:
      contents: read
  pyproject-build:
    name: 🏗️ pyproject-fmt build
    uses: $/.github/workflows/pyproject_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  pyproject-test:
    name: 🧪 pyproject-fmt tests
    uses: $/.github/workflows/pyproject_fmt_test.yaml
    permissions:
      contents: read
  tox-build:
    name: 🏗️ tox-toml-fmt build
    uses: $/.github/workflows/tox_toml_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  tox-test:
    name: 🧪 tox-toml-fmt tests
    uses: $/.github/workflows/tox_toml_fmt_test.yaml
    permissions:
      contents: read
  release:
    name: 🏷️ Release dry run ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [pyproject-fmt, tox-toml-fmt]
    uses: $/.github/workflows/prepare-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      package: ${{ matrix.package }}
      dry-run: true
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@e1361e2efa1e9dd9705bb9be719d923cd9154707 # 6.7.1
    permissions:
      contents: read
  gate:
    name: 🚦 Required checks pass
    if: always()
    needs: [tasks, common, toml-doc, shared-build, shared-test, pyproject-build, pyproject-test, tox-build, tox-test, release, hooks]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@211c2575e3dc9cce9a3e0dc1e2fdcd4a13f40abd # 6.5.3
        with:
          needs: ${{ toJSON(needs) }}
