name: PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: {}
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  news:
    name: News fragment
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List changed paths
        run: git diff --diff-filter=AM --name-only "origin/$GITHUB_BASE_REF"...HEAD >"$RUNNER_TEMP/changed-paths"
      - name: Validate package fragments
        id: fragments
        run: |
          set -euo pipefail
          pyproject_found=false
          tox_found=false
          common_found=false
          found_any=false
          while IFS= read -r path; do
            case "$path" in
            changelog.d/pyproject-fmt/*.md) pyproject_found=true ;;
            changelog.d/tox-toml-fmt/*.md) tox_found=true ;;
            changelog.d/toml-fmt-common/*.md) common_found=true ;;
            *) continue ;;
            esac
            found_any=true
            name=${path##*/}
            category=${name%.md}
            category=${category##*.}
            case "$category" in
            feature | change | bugfix | doc | breaking | security | performance | deprecation | removal | packaging) ;;
            *)
              echo "::error::unknown changelog category: $path"
              exit 1
              ;;
            esac
            stem=${name%.*.*}
            if ! { [[ "$stem" == +?* && "${stem#+}" != *[!a-zA-Z0-9-]* ]] ||
              [[ -n "$stem" && "$stem" != *[!0-9]* ]]; } ||
              [[ -z $(tr -d '[:space:]' <"$path") ]]; then
              echo "::error::invalid or empty changelog fragment: $path"
              exit 1
            fi
          done <"$RUNNER_TEMP/changed-paths"
          {
            echo "pyproject=$pyproject_found"
            echo "tox=$tox_found"
            echo "common=$common_found"
            echo "any=$found_any"
          } >>"$GITHUB_OUTPUT"
      - name: Require affected package fragments
        env:
          SKIP_NEWS: ${{ contains(github.event.pull_request.labels.*.name, 'skip news') }}
          BOT_AUTHOR: ${{ github.event.pull_request.user.type == 'Bot' }}
          PYPROJECT_FOUND: ${{ steps.fragments.outputs.pyproject }}
          TOX_FOUND: ${{ steps.fragments.outputs.tox }}
          COMMON_FOUND: ${{ steps.fragments.outputs.common }}
          FOUND_ANY: ${{ steps.fragments.outputs.any }}
        run: |
          if [[ "$SKIP_NEWS" == true || "$BOT_AUTHOR" == true ]]; then
            exit 0
          fi
          pyproject_required=false
          tox_required=false
          common_required=false
          while IFS= read -r path; do
            case "$path" in
            pyproject-fmt/*) pyproject_required=true ;;
            tox-toml-fmt/*) tox_required=true ;;
            toml-fmt-common/*) common_required=true ;;
            common/* | toml-doc/* | tox-rules/* | Cargo.toml | Cargo.lock)
              pyproject_required=true
              tox_required=true
              ;;
            esac
          done <"$RUNNER_TEMP/changed-paths"
          if [[ "$FOUND_ANY" != true ]] ||
            [[ "$pyproject_required" == true && "$PYPROJECT_FOUND" != true ]] ||
            [[ "$tox_required" == true && "$TOX_FOUND" != true ]] ||
            [[ "$common_required" == true && "$COMMON_FOUND" != true ]]; then
            echo '::error::add package changelog fragments or apply skip news'
            exit 1
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Install locked release tools
        run: uv sync --locked --python 3.15 --no-default-groups --group release --no-install-workspace
      - name: Check assembled package news
        run: |
          set -euo pipefail
          for package in pyproject-fmt tox-toml-fmt toml-fmt-common; do
            fragments=(changelog.d/"$package"/*.md)
            if [[ -f "${fragments[0]}" ]]; then
              .venv/bin/python tasks/assemble_release.py "$package" 0.0.0
            fi
          done
  tasks:
    name: Maintenance tasks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Install locked test tools
        run: uv sync --locked --python 3.15 --package pyproject-fmt --no-default-groups --only-group test --no-install-workspace
      - name: Test maintenance tasks
        env:
          PYTHONPATH: .:tasks
        run: .venv/bin/python -m pytest -q tests/tasks
  hook-update-cooldown:
    name: Hook update cooldown
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/check-hook-update-cooldown@8db87d4730353b61630d66cbc592d6bed0c85d2b
        with:
          repository: ${{ github.repository }}
          pull-request: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
  common:
    uses: $/.github/workflows/common.yaml
    permissions:
      contents: read
  toml-doc:
    uses: $/.github/workflows/toml_doc.yaml
    permissions:
      contents: read
  shared-build:
    uses: $/.github/workflows/toml_fmt_common_build.yaml
    permissions:
      contents: read
  shared-test:
    uses: $/.github/workflows/toml_fmt_common_test.yaml
    permissions:
      contents: read
  pyproject-build:
    uses: $/.github/workflows/pyproject_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  pyproject-test:
    uses: $/.github/workflows/pyproject_fmt_test.yaml
    permissions:
      contents: read
  tox-build:
    uses: $/.github/workflows/tox_toml_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  tox-test:
    uses: $/.github/workflows/tox_toml_fmt_test.yaml
    permissions:
      contents: read
  gate:
    name: Required checks pass
    if: always()
    needs: [news, tasks, hook-update-cooldown, common, toml-doc, shared-build, shared-test, pyproject-build, pyproject-test, tox-build, tox-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" \
            'all(to_entries[]; .value.result == "success" or ($event != "pull_request" and .value.result == "skipped"))' \
            <<<"$NEEDS_JSON"
