name: PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tasks:
    name: Maintenance tasks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Install current test tools
        run: |
          uv venv --python 3.15 .venv
          uv pip install --python .venv/bin/python --group pyproject-fmt/pyproject.toml:test
      - name: Test maintenance tasks
        env:
          PYTHONPATH: .:tasks
        run: .venv/bin/python -m pytest -q tests/tasks
  hook-update-cooldown:
    name: Hook update cooldown
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/check-hook-update-cooldown@74472c1a3602ca9b66db058ea31578865e1d208b
  common:
    uses: $/.github/workflows/common.yaml
    permissions:
      contents: read
  toml-doc:
    uses: $/.github/workflows/toml_doc.yaml
    permissions:
      contents: read
  shared-build:
    uses: $/.github/workflows/toml_fmt_common_build.yaml
    permissions:
      contents: read
  shared-test:
    uses: $/.github/workflows/toml_fmt_common_test.yaml
    permissions:
      contents: read
  pyproject-build:
    uses: $/.github/workflows/pyproject_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  pyproject-test:
    uses: $/.github/workflows/pyproject_fmt_test.yaml
    permissions:
      contents: read
  tox-build:
    uses: $/.github/workflows/tox_toml_fmt_build.yaml
    permissions:
      contents: read
      pull-requests: read
  tox-test:
    uses: $/.github/workflows/tox_toml_fmt_test.yaml
    permissions:
      contents: read
  gate:
    name: Required checks pass
    if: always()
    needs: [tasks, hook-update-cooldown, common, toml-doc, shared-build, shared-test, pyproject-build, pyproject-test, tox-build, tox-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" \
            'all(to_entries[]; .value.result == "success" or ($event != "pull_request" and .value.result == "skipped"))' \
            <<<"$NEEDS_JSON"
