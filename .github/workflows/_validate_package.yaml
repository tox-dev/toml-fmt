name: Validate package release
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      version:
        required: true
        type: string
      artifact-pattern:
        required: true
        type: string
permissions: {}
jobs:
  validate-source:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Check package tag
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "$PACKAGE/$VERSION"
      - name: Check Cargo version
        if: inputs.package != 'toml-fmt-common'
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$PACKAGE/Cargo.toml" | head -n 1)" = "$VERSION"
      - name: Check Python package version
        if: inputs.package == 'toml-fmt-common'
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(uv version --package toml-fmt-common --short)" = "$VERSION"
      - name: Install locked release tools
        run: uv sync --locked --python 3.15 --no-default-groups --only-group release --no-install-workspace
      - name: Check changelog release notes
        env:
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ github.ref_name }}
        run: |
          .venv/bin/release-creator notes --changelog CHANGELOG.md --package "$PACKAGE" --tag "$TAG" --repository "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          grep -q '^### ' "$RUNNER_TEMP/notes.md"
  validate-artifacts:
    needs: validate-source
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: Install locked package checks
        env:
          PACKAGE: ${{ inputs.package }}
        run: uv sync --locked --python 3.15 --package "$PACKAGE" --no-default-groups --only-group pkg-meta --no-install-workspace
      - name: Check every distribution
        run: |
          .venv/bin/twine check dist/*
          .venv/bin/check-wheel-contents --no-config dist/*.whl
      - name: Verify release artifact set and hashes
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: .venv/bin/python tasks/verify_release_artifacts.py "$PACKAGE" "$VERSION" dist "$RUNNER_TEMP/dist.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.package }}-validated-dist
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.package }}-validated-manifest
          path: ${{ runner.temp }}/dist.sha256
          if-no-files-found: error
